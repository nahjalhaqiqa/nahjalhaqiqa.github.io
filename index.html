    <style>
    :root {
        --green: #00a977; --mint: #27d5b1; --gold: #d4af37; --gold-light: #fce8ad;
        --bg-body: #031622; 
        --panel: #041e2e; 
        --panel-hover: #072a40;
        --ink: #f0f7f6;
        --muted: #94b2b8; 
        --line: rgba(212, 175, 55, 0.25); 
        --input-bg: #02121c;
        --shadow: 0 10px 30px -10px rgba(0,0,0,0.6);
    }
    [data-theme="light"] {
        --bg-body: #f4f8f9; 
        --panel: #ffffff; 
        --panel-hover: #f9fbfb;
        --ink: #0f2328;
        --muted: #536e75; 
        --line: rgba(0, 0, 0, 0.12); 
        --input-bg: #f8fb9;
        --shadow: 0 10px 25px -10px rgba(0,0,0,0.08);
    }

    *{box-sizing:border-box; transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;}
    html{scroll-behavior:smooth}
    body{
        margin:0; color:var(--ink);
        font-family: 'Cairo', Tahoma, Arial, sans-serif;
        line-height:1.8; background:var(--bg-body);
        min-height: 100vh;
    }
    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}

    .wrap{width:min(1240px,calc(100% - 32px));margin:auto}

    header{
        position:sticky; top:0; z-index:100;
        background: #031622;
        border-bottom:1px solid var(--line);
    }
    [data-theme="light"] header { background: #ffffff; }
    .nav{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:15px}
    .brand{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:800;}
    .brand-text {display: flex; flex-direction: column; line-height: 1.2;}
    .brand-text span:last-child {font-size: 0.7rem; color: var(--gold); font-weight: 500;}
    .brand img{width:52px;height:52px;object-fit:contain;}

    nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    nav a{font-size:.88rem; font-weight:600; opacity:0.9; color:var(--ink);}
    nav a:hover, nav a.active{color:var(--gold); opacity:1;}

    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .icon-action-btn {
        background: none; border: none; color: var(--gold); font-size: 1.1rem; cursor: pointer; padding: 6px;
        display: flex; align-items: center; justify-content: center;
    }
    .install-btn-nav {
        background: rgba(39, 213, 177, 0.15); border: 1px solid var(--mint); color: var(--mint);
        padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 0.78rem; font-weight: 700; display: none;
    }

    .hero-banner {
        position: relative; width: 100%; min-height: 480px;
        background: linear-gradient(180deg, rgba(3, 22, 34, 0.75), rgba(3, 22, 34, 0.95)), url('assets/hero-bg.jpg') center/cover no-repeat;
        background-color: #031622;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        text-align: center; padding: 50px 16px; border-bottom: 1px solid var(--line); overflow: hidden;
    }
    .hero-content {
        max-width: 800px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .hero-banner h1 {
        font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 900; margin: 0; color: #fff;
        letter-spacing: -0.5px; text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hero-subtitle {
        font-size: 1.1rem; color: var(--gold); font-weight: 700; margin: 0;
    }
    .hero-desc {
        font-size: 0.95rem; color: var(--muted); max-width: 600px; margin: 0; line-height: 1.7;
    }

    .hero-search-box {
        margin-top: 15px; width: min(520px, 100%); position: relative;
    }
    .hero-search-box input {
        width: 100%; padding: 14px 20px 14px 50px; border-radius: 30px;
        border: 1px solid var(--line); background: rgba(2, 18, 28, 0.85); color: #fff;
        outline: none; font-size: 0.95rem; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .hero-search-box input:focus { border-color: var(--gold); }
    .hero-search-box button {
        position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
        background: var(--gold); border: none; width: 38px; height: 38px; border-radius: 50%;
        color: #031622; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }

    .quick-cards-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 14px;
        margin: -35px auto 30px;
        position: relative;
        z-index: 10;
    }
    .quick-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px 12px;
        text-align: center;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }
    .quick-card:hover { border-color: var(--mint); transform: translateY(-4px); background: var(--panel-hover); }
    .quick-card .q-icon { font-size: 1.8rem; color: var(--gold); margin-bottom: 2px; }
    .quick-card h3 { margin: 0; font-size: 0.95rem; font-weight: 800; color: var(--ink); }
    .quick-card p { margin: 0; font-size: 0.75rem; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    section{padding:15px 0}

    .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:20px 0 14px}
    .head h2{margin:0;font-size:1.4rem; font-weight:800; color:var(--ink);}
    .head small{color:var(--gold); font-weight:700; cursor:pointer; font-size:0.9rem;}
    .head small:hover { text-decoration: underline; }

    .main-content-grid {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 20px;
        align-items: start;
    }

    .verse-side-card {
        background: linear-gradient(135deg, #041e2e, #02121c);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
        box-shadow: var(--shadow);
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    .verse-side-card h3 { color: var(--gold); font-size: 1.1rem; margin: 0 0 15px; font-weight: 800; }
    .verse-text { font-size: 1.15rem; font-weight: 700; color: #fff; line-height: 1.9; margin-bottom: 12px; }
    .verse-source { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }

    .verse-day-topline{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);font-size:.82rem;font-weight:800;letter-spacing:.5px;margin-bottom:5px}
    .verse-day-icon{font-size:1.15rem;opacity:.8}
    .verse-text{padding:14px 8px;border-top:1px solid rgba(243,213,138,.2);border-bottom:1px solid rgba(243,213,138,.2);text-shadow:0 2px 14px rgba(243,213,138,.08);min-height:100px;display:flex;align-items:center;justify-content:center}
    .verse-datetime{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}
    .verse-time-box{background:rgba(243,213,138,.07);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;gap:2px}
    .verse-time-label{font-size:.72rem;color:var(--muted)}
    .verse-time-box strong{font-size:.88rem;color:var(--gold);font-weight:800;direction:rtl}
    #siteClock{font-variant-numeric:tabular-nums;direction:ltr}

    .prayer-times-box {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        text-align: right;
    }
    .prayer-title {
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--gold);
        margin-bottom: 10px;
        text-align: center;
    }
    .prayer-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }
    .prayer-item {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 4px;
        text-align: center;
        font-size: 0.75rem;
    }
    .prayer-item.active {
        border-color: var(--mint);
        background: rgba(39, 213, 177, 0.15);
        color: var(--mint);
    }
    .prayer-item span { display: block; color: var(--muted); font-size: 0.68rem; }
    .prayer-item strong { color: #fff; font-size: 0.78rem; font-weight: 700; }
    </style>
</head>

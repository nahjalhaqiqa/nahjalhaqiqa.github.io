<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#063e42">
<meta name="description" content="نهج الحقيقة: مكتبة وثائق وبحوث وكتب وملفات PDF، وقناة نهج الحقيقة والمصادر المصورة.">
<title>نهج الحقيقة | المكتبة الرقمية والأدلة المصورة</title>
<link rel="icon" href="assets/logo.png">

<!-- استيراد خط Cairo من Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
    --green: #00a977; --mint: #27d5b1; --gold: #f3d58a;
    --bg-gradient: radial-gradient(circle at top right, rgba(87,33,225,0.35), transparent 40%), linear-gradient(135deg, #031e2e, #042c42 50%, #021a28);
    --bg-body: #042c42; 
    --panel: rgba(5, 36, 54, 0.75); 
    --panel-hover: rgba(8, 48, 71, 0.95);
    --ink: #effaf8;
    --muted: #a3c2c7; --line: rgba(255, 255, 255, 0.12); --input-bg: rgba(2, 22, 33, 0.6);
    --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    --glow: 0 0 25px rgba(39, 213, 177, 0.35);
}
[data-theme="light"] {
    --bg-gradient: radial-gradient(circle at top right, rgba(97,51,232,0.15), transparent 40%), linear-gradient(135deg, #eef4f8, #f8fafc 50%, #e2ebf0);
    --bg-body: #f4f8f9; 
    --panel: rgba(255, 255, 255, 0.85); 
    --panel-hover: rgba(255, 255, 255, 0.98);
    --ink: #0f2328;
    --muted: #536e75; --line: rgba(0, 0, 0, 0.08); --input-bg: #ffffff;
    --shadow: 0 10px 25px -10px rgba(0,0,0,0.08);
    --glow: 0 0 20px rgba(0, 169, 119, 0.2);
}

*{box-sizing:border-box; transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;}
html{scroll-behavior:smooth}
body{
    margin:0;
    color:var(--ink);
    font-family: 'Cairo', Tahoma, Arial, sans-serif;
    line-height:1.8;
    background:var(--bg-body);
    min-height: 100vh;
}
body:before{
    content:"";
    position:fixed;
    inset:0;
    background:var(--bg-gradient);
    z-index:-1;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}

.wrap{width:min(1180px,calc(100% - 32px));margin:auto}

/* الترويسة العليا (Header) */
header{
    position:sticky;
    top:0;
    z-index:100;
    background: rgba(3, 27, 41, 0.75);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}
[data-theme="light"] header {
    background: rgba(255, 255, 255, 0.8);
}
.nav{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:800;letter-spacing: -0.3px;}
.brand img{width:46px;height:46px;object-fit:contain;filter: drop-shadow(0 2px 8px rgba(0,217,154,0.3));}
nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
nav a{font-size:.95rem; font-weight:600; opacity:0.88;}
nav a:hover{color:var(--mint); opacity:1; transform: translateY(-1px);}

.theme-btn{
    background: rgba(243, 213, 138, 0.1);
    border:1px solid var(--gold);
    color:var(--gold);
    padding:6px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:.85rem;
    font-weight:700;
}
.theme-btn:hover{background:var(--gold);color:#000; box-shadow: var(--glow);}

/* قسم الواجهة الرئيسية (Hero) */
.hero{text-align:center;padding:55px 0 35px;position:relative;overflow:hidden}
.hero:after{
    content:"الحقيقة";
    position:absolute;
    right:50%;
    transform: translateX(50%);
    top:-10px;
    font-size:clamp(6rem,22vw,15rem);
    font-weight:900;
    color:rgba(255, 255, 255, 0.02);
    pointer-events:none;
    white-space: nowrap;
}
.hero>*{position:relative;z-index:1}
.hero-logo{
    width:110px;
    height:110px;
    object-fit:contain;
    filter:drop-shadow(0 8px 25px rgba(0, 0, 0, 0.4));
    margin-bottom: 10px;
}
h1{font-size:clamp(2.5rem,5.5vw,4.2rem);line-height:1.25;margin:0; font-weight:900; letter-spacing: -1px;}
.gold{color:var(--gold)}
.hero p{margin:12px 0 24px;font-size:1.2rem; color:var(--muted); font-weight:400;}

.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    padding:10px 22px;
    border:0;
    border-radius:30px;
    background: linear-gradient(135deg, var(--green), #00875e);
    color:white;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 4px 15px rgba(0, 169, 119, 0.3);
}
.btn:hover{transform:translateY(-2px); box-shadow: 0 6px 20px rgba(0, 169, 119, 0.45); opacity:1;}
.btn.red{background: linear-gradient(135deg, #df252c, #b0181e); box-shadow: 0 4px 15px rgba(223, 37, 44, 0.3);}
.btn.red:hover{box-shadow: 0 6px 20px rgba(223, 37, 44, 0.45);}
.btn.ghost{background:rgba(255,255,255,0.06);border:1px solid var(--line); color: var(--ink); box-shadow:none;}
.btn.ghost:hover{background:rgba(255,255,255,0.12); border-color: var(--mint);}

section{padding:20px 0}
.features{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.feature,.panel,.doc-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow: var(--shadow);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}
.feature:hover, .panel:hover {border-color: rgba(39, 213, 177, 0.3);}
.feature{padding:24px;display:flex;gap:18px;align-items:center}
.feature .ico{
    font-size:2.5rem; 
    background: rgba(39, 213, 177, 0.1); 
    width: 65px; height: 65px; 
    display: flex; align-items: center; justify-content: center; 
    border-radius: 16px; 
    border: 1px solid rgba(39, 213, 177, 0.2);
    flex-shrink: 0;
}
.feature h2{font-size:1.3rem;margin:0 0 6px; font-weight:700;}
.feature p{color:var(--muted);margin:0 0 14px;font-size:.95rem}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.head h2{margin:0;font-size:1.65rem; font-weight:800; border-right: 4px solid var(--mint); padding-right: 12px;}
.head small{color:var(--gold); font-weight:600;}

.tools{display:grid;grid-template-columns:1fr 240px;gap:12px;margin:16px 0 20px}
.tools input,.tools select{
    width:100%;
    padding:14px 18px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--input-bg);
    color:var(--ink);
    outline:none;
    font-size: 0.95rem;
}
.tools input:focus, .tools select:focus, .contact-form input:focus, .contact-form textarea:focus {
    border-color: var(--mint);
    box-shadow: 0 0 12px rgba(39, 213, 177, 0.25);
}
.tools input::placeholder{color:var(--muted)}
.tools select option{background: var(--bg-body); color: var(--ink);}

.doc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

/* تحويل البطاقة لتصبح وتتفاعل مثل الزر تماماً */
.doc-card{
    padding:22px;
    min-width:0;
    cursor:pointer;
    position: relative;
    overflow: hidden;
    user-select: none;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
}
.doc-card:hover{
    border-color: var(--mint);
    transform: translateY(-6px);
    background: var(--panel-hover);
    box-shadow: 0 18px 35px -10px rgba(0, 0, 0, 0.65), var(--glow);
}
.doc-card:active{
    transform: translateY(-1px) scale(0.98);
    box-shadow: 0 6px 15px -5px rgba(0, 0, 0, 0.5);
    border-color: var(--green);
}
.doc-card .symbol{font-size:2.2rem; margin-bottom: 8px;}
.doc-card h3{margin:8px 0;font-size:1.15rem; font-weight:700; line-height: 1.5;}
.doc-card p{color:var(--muted);font-size:.92rem;margin:8px 0 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;}
.tag{
    display:inline-block;
    padding:4px 12px;
    border-radius:20px;
    background:rgba(0, 169, 119, 0.15);
    border:1px solid rgba(0, 217, 154, 0.3);
    color:var(--mint);
    font-size:.8rem;
    font-weight:700
}
.doc-meta{font-size:.82rem;color:var(--muted);margin-bottom:14px; opacity:0.8;}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap}.doc-actions a{font-size:.88rem}

.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);display:none}
.note{
    background:rgba(243, 213, 138, 0.08);
    border:1px solid rgba(243, 213, 138, 0.3);
    padding:14px 18px;
    border-radius:14px;
    color:var(--ink);
    font-size:.92rem;
    margin-top:18px;
    display: flex; align-items: center; gap: 10px;
}

.video-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{padding:24px}
.videos-grid{display:grid;grid-template-columns:1fr;gap:18px;}
.video-item{
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    padding:12px;
}

/* النافذة المنبثقة (Modal) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z
